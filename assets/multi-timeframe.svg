<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Analyse multi-timeframe descendante</title><desc id="d">Du contexte Weekly et Daily au déclencheur M15 et M5, avec une information différente à chaque étage.</desc><defs><linearGradient id="bg" y2="1"><stop stop-color="#202d32"/><stop offset="1" stop-color="#182126"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#d9a441"/></marker></defs><rect width="1000" height="620" rx="28" fill="url(#bg)"/><text x="54" y="55" fill="#d6dcda" font-family="Arial" font-size="25" font-weight="700">Lecture top-down : une question par étage</text>
<g font-family="Arial"><rect x="70" y="92" width="860" height="96" rx="18" fill="#202d32" stroke="#33c795" stroke-width="3"/><text x="98" y="128" fill="#33c795" font-size="24" font-weight="700">WEEKLY / DAILY — CONTEXTE</text><text x="98" y="161" fill="#d6dcda" font-size="19">Biais haussier • cible : ancien sommet • invalidation : creux majeur</text>
<path d="M500 188v34" stroke="#d9a441" stroke-width="4" marker-end="url(#a)"/><rect x="125" y="230" width="750" height="96" rx="18" fill="#202d32" stroke="#d9a441" stroke-width="3"/><text x="153" y="266" fill="#d9a441" font-size="24" font-weight="700">H4 / H1 — STRUCTURE ET ZONE</text><text x="153" y="299" fill="#d6dcda" font-size="19">Retracement dans la zone • structure intacte • POI délimité</text>
<path d="M500 326v34" stroke="#d9a441" stroke-width="4" marker-end="url(#a)"/><rect x="180" y="368" width="640" height="96" rx="18" fill="#202d32" stroke="#aab4b7" stroke-width="3"/><text x="208" y="404" fill="#aab4b7" font-size="24" font-weight="700">M15 / M5 — DÉCLENCHEUR</text><text x="208" y="437" fill="#d6dcda" font-size="19">Sweep potentiel → CHoCH → déplacement → retracement</text>
<path d="M500 464v34" stroke="#d9a441" stroke-width="4" marker-end="url(#a)"/><rect x="235" y="506" width="530" height="70" rx="18" fill="#202d32" stroke="#e16468" stroke-width="3"/><text x="266" y="549" fill="#e16468" font-size="22" font-weight="700">M1 — OPTIONNEL : précision ou bruit</text></g><text x="54" y="603" fill="#8b9ca2" font-family="Arial" font-size="17">Le timeframe inférieur ne doit pas inventer un nouveau biais : il affine une décision déjà contextualisée.</text></svg>
