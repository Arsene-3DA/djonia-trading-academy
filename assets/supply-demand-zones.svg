<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Comparer une zone de demande et un Order Block</title>
  <desc id="desc">Schéma pédagogique montrant une base, un départ, un retest, une zone classique et un Order Block ICT plus étroit.</desc>
  <defs>
    <pattern id="sdGrid" width="48" height="44" patternUnits="userSpaceOnUse"><path d="M48 0H0V44" fill="none" stroke="#526166" stroke-width="1" opacity=".28"/></pattern>
    <marker id="sdArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#eef1ee"/></marker>
  </defs>
  <rect width="1100" height="620" rx="18" fill="#182126"/>
  <text x="42" y="52" fill="#eef1ee" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="700">MASTERCLASS OFFRE &amp; DEMANDE</text>
  <text x="1058" y="52" text-anchor="end" fill="#aab4b7" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14">Même structure · conventions différentes</text>

  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <rect x="40" y="82" width="684" height="482" rx="8" fill="#202d32" stroke="#526166"/>
    <rect x="64" y="118" width="636" height="408" fill="url(#sdGrid)"/>
    <text x="64" y="108" fill="#aab4b7" font-size="13">STRUCTURE DE PRIX SIMULÉE</text>

    <rect x="250" y="382" width="246" height="94" fill="#d9a441" fill-opacity=".16" stroke="#d9a441" stroke-width="2"/>
    <rect x="330" y="405" width="62" height="54" fill="#33c795" fill-opacity=".2" stroke="#33c795" stroke-width="2"/>
    <rect x="486" y="172" width="170" height="58" fill="#e16468" fill-opacity=".13" stroke="#e16468" stroke-width="2"/>

    <path d="M82 438L126 390L168 418L210 356L252 406L286 428L328 442L366 414L402 430L448 348L490 286L532 214L574 182L616 246L654 292L684 242" fill="none" stroke="#eef1ee" stroke-width="3"/>
    <g fill="#33c795" stroke="#33c795" stroke-width="2">
      <line x1="126" y1="372" x2="126" y2="414"/><rect x="119" y="382" width="14" height="22"/>
      <line x1="210" y1="338" x2="210" y2="382"/><rect x="203" y="350" width="14" height="22"/>
      <line x1="448" y1="326" x2="448" y2="370"/><rect x="441" y="338" width="14" height="24"/>
      <line x1="490" y1="264" x2="490" y2="308"/><rect x="483" y="276" width="14" height="24"/>
      <line x1="532" y1="192" x2="532" y2="238"/><rect x="525" y="204" width="14" height="26"/>
      <line x1="574" y1="162" x2="574" y2="204"/><rect x="567" y="174" width="14" height="22"/>
    </g>
    <g fill="#e16468" stroke="#e16468" stroke-width="2">
      <line x1="168" y1="396" x2="168" y2="438"/><rect x="161" y="406" width="14" height="22"/>
      <line x1="252" y1="386" x2="252" y2="428"/><rect x="245" y="396" width="14" height="22"/>
      <line x1="286" y1="410" x2="286" y2="452"/><rect x="279" y="420" width="14" height="22"/>
      <line x1="328" y1="422" x2="328" y2="462"/><rect x="321" y="432" width="14" height="20"/>
      <line x1="366" y1="394" x2="366" y2="438"/><rect x="359" y="404" width="14" height="24"/>
      <line x1="402" y1="410" x2="402" y2="450"/><rect x="395" y="420" width="14" height="20"/>
      <line x1="616" y1="224" x2="616" y2="268"/><rect x="609" y="234" width="14" height="24"/>
      <line x1="654" y1="270" x2="654" y2="312"/><rect x="647" y="280" width="14" height="22"/>
    </g>

    <line x1="468" y1="394" x2="532" y2="330" stroke="#eef1ee" stroke-width="1.5" marker-end="url(#sdArrow)"/>
    <rect x="438" y="352" width="168" height="34" rx="4" fill="#182126" stroke="#eef1ee"/>
    <text x="522" y="374" text-anchor="middle" fill="#eef1ee" font-size="13" font-weight="700">DÉPART IMPULSIF</text>

    <line x1="392" y1="459" x2="424" y2="498" stroke="#33c795" stroke-width="1.5"/>
    <rect x="424" y="486" width="132" height="32" rx="4" fill="#182126" stroke="#33c795"/>
    <text x="490" y="507" text-anchor="middle" fill="#6be0b5" font-size="13" font-weight="700">ORDER BLOCK · ICT</text>

    <line x1="250" y1="430" x2="196" y2="474" stroke="#d9a441" stroke-width="1.5"/>
    <rect x="76" y="470" width="204" height="36" rx="4" fill="#182126" stroke="#d9a441"/>
    <text x="178" y="493" text-anchor="middle" fill="#f0c766" font-size="13" font-weight="700">ZONE DE DEMANDE · CLASSIQUE</text>

    <line x1="616" y1="246" x2="650" y2="334" stroke="#ef8f93" stroke-width="1.5" stroke-dasharray="5 5"/>
    <rect x="548" y="322" width="142" height="34" rx="4" fill="#182126" stroke="#e16468"/>
    <text x="619" y="344" text-anchor="middle" fill="#ef8f93" font-size="13" font-weight="700">PREMIER RETEST</text>

    <rect x="750" y="82" width="310" height="482" rx="8" fill="#d7e0de"/>
    <text x="778" y="122" fill="#182126" font-size="17" font-weight="700">COMPARAISON OBLIGATOIRE</text>
    <line x1="778" y1="140" x2="1032" y2="140" stroke="#aab4b7"/>
    <text x="778" y="176" fill="#765610" font-size="14" font-weight="700">OFFRE / DEMANDE CLASSIQUE</text>
    <text x="778" y="202" fill="#3d4c52" font-size="13"><tspan x="778" dy="0">• base complète selon la règle</tspan><tspan x="778" dy="22">• fraîcheur et retests documentés</tspan><tspan x="778" dy="22">• départ comparé au contexte</tspan></text>
    <text x="778" y="292" fill="#0b6b50" font-size="14" font-weight="700">ORDER BLOCK · VISION ICT</text>
    <text x="778" y="318" fill="#3d4c52" font-size="13"><tspan x="778" dy="0">• dernière bougie opposée</tspan><tspan x="778" dy="22">• déplacement et cassure définis</tspan><tspan x="778" dy="22">• bornes selon la convention ICT</tspan></text>
    <rect x="778" y="402" width="254" height="106" rx="5" fill="#182126"/>
    <text x="796" y="430" fill="#eef1ee" font-size="13" font-weight="700">À NE PAS CONFONDRE</text>
    <text x="796" y="456" fill="#b9c3c4" font-size="12"><tspan x="796" dy="0">Deux noms peuvent décrire la même</tspan><tspan x="796" dy="19">origine de mouvement. La définition</tspan><tspan x="796" dy="19">et l’invalidation tranchent.</tspan></text>
    <text x="750" y="594" fill="#aab4b7" font-size="12">Schéma pédagogique · aucune zone ne garantit une réaction.</text>
  </g>
</svg>
