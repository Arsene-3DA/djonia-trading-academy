<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Carte de session pour US30, NAS100 et GER40</title>
  <desc id="desc">Comparaison pédagogique des produits, ouvertures cash, fenêtres macro et calcul de risque par point.</desc>
  <rect width="1100" height="620" rx="18" fill="#182126"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <text x="42" y="52" fill="#eef1ee" font-size="22" font-weight="700">MASTERCLASS INDICES</text>
    <text x="1058" y="52" text-anchor="end" fill="#aab4b7" font-size="14">US30 · NAS100 · GER40</text>

    <rect x="40" y="84" width="1020" height="168" rx="8" fill="#202d32" stroke="#526166"/>
    <text x="66" y="118" fill="#eef1ee" font-size="15" font-weight="700">FRISE DE SESSION · HEURES À VÉRIFIER SELON LA DATE ET LE PRODUIT</text>
    <line x1="92" y1="176" x2="1018" y2="176" stroke="#aab4b7" stroke-width="2"/>
    <g fill="#aab4b7" font-size="12" text-anchor="middle">
      <text x="120" y="208">07:00 UTC</text><text x="378" y="208">09:00 UTC</text><text x="636" y="208">13:30 UTC</text><text x="894" y="208">16:30 UTC</text>
    </g>
    <g>
      <rect x="92" y="142" width="286" height="40" rx="4" fill="#d9a441" fill-opacity=".75"/>
      <text x="235" y="167" text-anchor="middle" fill="#182126" font-size="13" font-weight="700">EUROPE / DAX · REPÈRE CASH</text>
      <rect x="636" y="142" width="258" height="40" rx="4" fill="#33c795" fill-opacity=".75"/>
      <text x="765" y="167" text-anchor="middle" fill="#182126" font-size="13" font-weight="700">OUVERTURE CASH USA</text>
      <line x1="636" y1="130" x2="636" y2="222" stroke="#ef8f93" stroke-width="2" stroke-dasharray="5 5"/>
      <rect x="552" y="92" width="168" height="30" rx="4" fill="#182126" stroke="#e16468"/>
      <text x="636" y="112" text-anchor="middle" fill="#ef8f93" font-size="12" font-weight="700">FENÊTRE MACRO POSSIBLE</text>
    </g>

    <g font-size="13">
      <rect x="40" y="280" width="316" height="208" rx="8" fill="#d7e0de"/>
      <text x="66" y="318" fill="#182126" font-size="18" font-weight="700">US30</text>
      <text x="330" y="318" text-anchor="end" fill="#765610" font-weight="700">DOW JONES</text>
      <line x1="66" y1="336" x2="330" y2="336" stroke="#aab4b7"/>
      <text x="66" y="365" fill="#3d4c52"><tspan x="66" dy="0">• indice, future YM ou CFD ?</tspan><tspan x="66" dy="24">• 30 grandes sociétés américaines</tspan><tspan x="66" dy="24">• pondération propre au Dow</tspan><tspan x="66" dy="24">• valeur du point à vérifier</tspan></text>

      <rect x="392" y="280" width="316" height="208" rx="8" fill="#d7e0de"/>
      <text x="418" y="318" fill="#182126" font-size="18" font-weight="700">NAS100</text>
      <text x="682" y="318" text-anchor="end" fill="#0b6b50" font-weight="700">NASDAQ-100</text>
      <line x1="418" y1="336" x2="682" y2="336" stroke="#aab4b7"/>
      <text x="418" y="365" fill="#3d4c52"><tspan x="418" dy="0">• indice, future NQ ou CFD ?</tspan><tspan x="418" dy="24">• grandes sociétés non financières</tspan><tspan x="418" dy="24">• sensibilité aux grandes composantes</tspan><tspan x="418" dy="24">• multiplicateur propre au contrat</tspan></text>

      <rect x="744" y="280" width="316" height="208" rx="8" fill="#d7e0de"/>
      <text x="770" y="318" fill="#182126" font-size="18" font-weight="700">GER40</text>
      <text x="1034" y="318" text-anchor="end" fill="#a8373e" font-weight="700">DAX</text>
      <line x1="770" y1="336" x2="1034" y2="336" stroke="#aab4b7"/>
      <text x="770" y="365" fill="#3d4c52"><tspan x="770" dy="0">• DAX, future Eurex ou CFD ?</tspan><tspan x="770" dy="24">• 40 grandes valeurs allemandes</tspan><tspan x="770" dy="24">• BCE et données européennes</tspan><tspan x="770" dy="24">• contrat et devise à vérifier</tspan></text>
    </g>

    <rect x="40" y="514" width="1020" height="70" rx="6" fill="#11191d" stroke="#526166"/>
    <text x="66" y="543" fill="#f0c766" font-size="13" font-weight="700">LIEN DIRECT AVEC LE MODULE 8</text>
    <text x="66" y="568" fill="#eef1ee" font-size="16" font-weight="700">Risque = distance du Stop en points × valeur du point × contrats ou lots</text>
    <text x="1034" y="556" text-anchor="end" fill="#ef8f93" font-size="12"><tspan x="1034" dy="0">Ne copie jamais la valeur du point</tspan><tspan x="1034" dy="18">d’un indice vers un autre.</tspan></text>
  </g>
</svg>
