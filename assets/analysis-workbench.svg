<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Atelier d’analyse multi-timeframe</title>
  <desc id="desc">Trois panneaux relient contexte Daily, zone H1 et confirmation M5 avant le calcul du risque.</desc>
  <defs>
    <pattern id="grid" width="44" height="42" patternUnits="userSpaceOnUse"><path d="M44 0H0V42" fill="none" stroke="#526166" stroke-width="1" opacity=".34"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#aab4b7"/></marker>
  </defs>
  <rect width="1200" height="700" rx="22" fill="#182126"/>
  <text x="48" y="58" fill="#eef1ee" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="700">ATELIER D’ANALYSE / DU CONTEXTE À L’EXÉCUTION</text>
  <text x="1152" y="58" text-anchor="end" fill="#aab4b7" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14">Exemple pédagogique</text>

  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <g transform="translate(48 96)">
      <rect width="326" height="430" rx="8" fill="#202d32" stroke="#526166"/>
      <rect x="20" y="66" width="286" height="278" fill="url(#grid)"/>
      <text x="22" y="34" fill="#eef1ee" font-size="18" font-weight="700">1 · DAILY</text>
      <text x="304" y="34" fill="#6be0b5" font-size="13" text-anchor="end">BIAIS HAUSSIER</text>
      <path d="M34 292L76 244L112 266L154 194L196 226L238 146L284 178" fill="none" stroke="#eef1ee" stroke-width="3"/>
      <circle cx="76" cy="244" r="5" fill="#33c795"/><circle cx="112" cy="266" r="5" fill="#33c795"/><circle cx="154" cy="194" r="5" fill="#33c795"/><circle cx="196" cy="226" r="5" fill="#33c795"/><circle cx="238" cy="146" r="5" fill="#33c795"/>
      <text x="158" y="182" fill="#6be0b5" font-size="12" font-weight="700">HH</text><text x="200" y="246" fill="#6be0b5" font-size="12" font-weight="700">HL</text>
      <line x1="20" y1="132" x2="306" y2="132" stroke="#d9a441" stroke-width="2" stroke-dasharray="7 6"/>
      <text x="26" y="121" fill="#f0c766" font-size="12" font-weight="700">Liquidité externe</text>
      <text x="22" y="378" fill="#aab4b7" font-size="13">Question :</text><text x="22" y="400" fill="#eef1ee" font-size="14" font-weight="700">Dans quel sens préparer ?</text>
    </g>

    <line x1="386" y1="310" x2="426" y2="310" stroke="#aab4b7" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(438 96)">
      <rect width="326" height="430" rx="8" fill="#202d32" stroke="#526166"/>
      <rect x="20" y="66" width="286" height="278" fill="url(#grid)"/>
      <text x="22" y="34" fill="#eef1ee" font-size="18" font-weight="700">2 · H1</text>
      <text x="304" y="34" fill="#f0c766" font-size="13" text-anchor="end">ZONE / POI</text>
      <rect x="22" y="236" width="282" height="58" fill="#d9a441" fill-opacity=".16" stroke="#d9a441"/>
      <path d="M34 132L72 166L108 122L144 176L180 154L218 270L254 222L292 184" fill="none" stroke="#eef1ee" stroke-width="3"/>
      <line x1="20" y1="116" x2="306" y2="116" stroke="#d9a441" stroke-width="2" stroke-dasharray="7 6"/>
      <text x="28" y="107" fill="#f0c766" font-size="12" font-weight="700">Equal Highs</text>
      <line x1="218" y1="270" x2="218" y2="324" stroke="#e16468" stroke-width="3"/>
      <circle cx="218" cy="300" r="6" fill="#e16468"/>
      <text x="228" y="318" fill="#ef8f93" font-size="12" font-weight="700">Sweep SSL</text>
      <text x="22" y="378" fill="#aab4b7" font-size="13">Question :</text><text x="22" y="400" fill="#eef1ee" font-size="14" font-weight="700">Où attendre le prix ?</text>
    </g>

    <line x1="776" y1="310" x2="816" y2="310" stroke="#aab4b7" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(828 96)">
      <rect width="324" height="430" rx="8" fill="#202d32" stroke="#526166"/>
      <rect x="20" y="66" width="284" height="278" fill="url(#grid)"/>
      <text x="22" y="34" fill="#eef1ee" font-size="18" font-weight="700">3 · M5</text>
      <text x="302" y="34" fill="#6be0b5" font-size="13" text-anchor="end">DÉCLENCHEUR</text>
      <path d="M34 178L68 214L104 240L140 292L174 220L210 154L248 184L288 112" fill="none" stroke="#eef1ee" stroke-width="3"/>
      <line x1="112" y1="240" x2="292" y2="240" stroke="#e16468" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="118" y="260" fill="#ef8f93" font-size="12" font-weight="700">Dernier LH cassé</text>
      <rect x="180" y="184" width="62" height="44" fill="#33c795" fill-opacity=".14" stroke="#33c795"/>
      <text x="211" y="176" text-anchor="middle" fill="#6be0b5" font-size="12" font-weight="700">FVG</text>
      <circle cx="210" cy="154" r="6" fill="#33c795"/>
      <text x="218" y="144" fill="#6be0b5" font-size="12" font-weight="700">CHoCH</text>
      <text x="22" y="378" fill="#aab4b7" font-size="13">Question :</text><text x="22" y="400" fill="#eef1ee" font-size="14" font-weight="700">Qu’est-ce qui autorise l’entrée ?</text>
    </g>
  </g>

  <g transform="translate(48 558)" font-family="IBM Plex Sans, Arial, sans-serif">
    <rect width="1104" height="100" rx="8" fill="#d7e0de"/>
    <text x="26" y="35" fill="#182126" font-size="13" font-weight="700">CHAÎNE DE DÉCISION</text>
    <text x="26" y="67" fill="#182126" font-size="18" font-weight="700">Contexte</text>
    <text x="160" y="67" fill="#526166" font-size="18">›</text>
    <text x="198" y="67" fill="#182126" font-size="18" font-weight="700">Zone</text>
    <text x="304" y="67" fill="#526166" font-size="18">›</text>
    <text x="342" y="67" fill="#182126" font-size="18" font-weight="700">Confirmation</text>
    <text x="500" y="67" fill="#526166" font-size="18">›</text>
    <text x="538" y="67" fill="#182126" font-size="18" font-weight="700">Invalidation</text>
    <text x="682" y="67" fill="#526166" font-size="18">›</text>
    <text x="720" y="67" fill="#765610" font-size="18" font-weight="700">Calcul du risque</text>
    <rect x="884" y="25" width="192" height="52" rx="5" fill="#0b6b50"/>
    <text x="980" y="57" text-anchor="middle" fill="#eef1ee" font-size="13" font-weight="700">ENTRÉE OU NON-TRADE</text>
  </g>
</svg>
