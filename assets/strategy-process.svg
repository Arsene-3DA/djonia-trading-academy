<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" role="img" aria-labelledby="t d"><title id="t">Processus complet d'une stratégie de trading</title><desc id="d">Du contexte à la revue, avec embranchement non-trade si une condition obligatoire manque.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#d9a441"/></marker></defs><rect width="1060" height="660" rx="28" fill="#182126"/><text x="52" y="55" fill="#d6dcda" font-family="Arial" font-size="25" font-weight="700">Stratégie testable : chaque étape produit une décision</text><g font-family="Arial" font-size="18" font-weight="700" text-anchor="middle"><g fill="#34434a" stroke="#33c795" stroke-width="2"><rect x="70" y="100" width="240" height="68" rx="15"/><rect x="410" y="100" width="240" height="68" rx="15"/><rect x="750" y="100" width="240" height="68" rx="15"/></g><text x="190" y="141" fill="#d6dcda">1 · CONTEXTE HTF</text><text x="530" y="141" fill="#d6dcda">2 · LIQUIDITÉ / POI</text><text x="870" y="141" fill="#d6dcda">3 · ARRIVÉE DU PRIX</text><path d="M310 134h90M650 134h90" stroke="#d9a441" stroke-width="4" marker-end="url(#a)"/>
<g fill="#34434a" stroke="#d9a441" stroke-width="2"><rect x="750" y="240" width="240" height="68" rx="15"/><rect x="410" y="240" width="240" height="68" rx="15"/><rect x="70" y="240" width="240" height="68" rx="15"/></g><text x="870" y="281" fill="#d6dcda">4 · CONFIRMATION</text><text x="530" y="281" fill="#d6dcda">5 · INVALIDATION</text><text x="190" y="281" fill="#d6dcda">6 · RISQUE / TAILLE</text><path d="M870 168v62M750 274h-90M410 274h-90" stroke="#d9a441" stroke-width="4" marker-end="url(#a)"/>
<g fill="#34434a" stroke="#aab4b7" stroke-width="2"><rect x="70" y="380" width="240" height="68" rx="15"/><rect x="410" y="380" width="240" height="68" rx="15"/><rect x="750" y="380" width="240" height="68" rx="15"/></g><text x="190" y="421" fill="#d6dcda">7 · ENTRÉE</text><text x="530" y="421" fill="#d6dcda">8 · GESTION / SORTIE</text><text x="870" y="421" fill="#d6dcda">9 · JOURNAL / REVUE</text><path d="M190 308v62M310 414h90M650 414h90" stroke="#d9a441" stroke-width="4" marker-end="url(#a)"/>
<path d="M530 308v195" stroke="#e16468" stroke-width="4" marker-end="url(#a)"/><rect x="360" y="520" width="340" height="78" rx="18" fill="#4a2328" stroke="#e16468" stroke-width="3"/><text x="530" y="552" fill="#e16468">CONDITION OBLIGATOIRE ABSENTE</text><text x="530" y="581" fill="#fff" font-size="21">→ NON-TRADE</text></g><text x="52" y="632" fill="#8b9ca2" font-family="Arial" font-size="17">Une stratégie n'est testable que si une autre personne peut appliquer les mêmes règles.</text></svg>
