<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="t d"><title id="t">Comparaison Wyckoff et ICT SMC</title><desc id="d">Ressemblances partielles entre Spring et sweep de SSL, UTAD et sweep de BSL.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#d9a441"/></marker></defs><rect width="1040" height="560" rx="28" fill="#182126"/><text x="50" y="54" fill="#d6dcda" font-family="Arial" font-size="25" font-weight="700">Wyckoff ↔ ICT/SMC : ressemblances, pas équivalences</text><g font-family="Arial"><text x="160" y="105" fill="#d9a441" font-size="22" font-weight="700">WYCKOFF</text><text x="770" y="105" fill="#33c795" font-size="22" font-weight="700">ICT / SMC</text><g fill="#202d32" stroke-width="3"><rect x="60" y="135" width="330" height="88" rx="16" stroke="#d9a441"/><rect x="650" y="135" width="330" height="88" rx="16" stroke="#33c795"/><rect x="60" y="265" width="330" height="88" rx="16" stroke="#d9a441"/><rect x="650" y="265" width="330" height="88" rx="16" stroke="#33c795"/><rect x="60" y="395" width="330" height="88" rx="16" stroke="#d9a441"/><rect x="650" y="395" width="330" height="88" rx="16" stroke="#33c795"/></g><g fill="#d6dcda" font-size="20" text-anchor="middle"><text x="225" y="172" font-weight="700">Spring</text><text x="225" y="200">sous le support du range</text><text x="815" y="172" font-weight="700">Sweep de SSL</text><text x="815" y="200">sous des creux identifiés</text><text x="225" y="302" font-weight="700">UTAD</text><text x="225" y="330">au-dessus du range</text><text x="815" y="302" font-weight="700">Sweep de BSL</text><text x="815" y="330">au-dessus de sommets</text><text x="225" y="432" font-weight="700">SOS / SOW</text><text x="225" y="460">force ou faiblesse dans la phase</text><text x="815" y="432" font-weight="700">Displacement</text><text x="815" y="460">expansion directionnelle</text></g><g stroke="#d9a441" stroke-width="4" marker-end="url(#a)"><path d="M400 179h230"/><path d="M400 309h230"/><path d="M400 439h230"/></g><text x="520" y="166" fill="#e16468" font-size="16" text-anchor="middle">contexte différent</text><text x="520" y="296" fill="#e16468" font-size="16" text-anchor="middle">contexte différent</text><text x="520" y="426" fill="#e16468" font-size="16" text-anchor="middle">lecture différente</text></g><text x="50" y="528" fill="#d6dcda" font-family="Arial" font-size="17">La forme peut se ressembler ; la définition, le contexte et la validation appartiennent à des méthodologies distinctes.</text></svg>
