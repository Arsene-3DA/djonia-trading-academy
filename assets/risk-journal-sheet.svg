<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Journal de risque et revue de trade</title>
  <desc id="desc">Fiche pédagogique regroupant calcul du risque, données du trade, checklist et courbe de capital.</desc>
  <defs>
    <pattern id="paperGrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#aab4b7" stroke-width="1" opacity=".25"/></pattern>
  </defs>
  <rect width="1200" height="700" rx="22" fill="#182126"/>
  <rect x="38" y="38" width="1124" height="624" rx="12" fill="#d7e0de"/>
  <rect x="38" y="38" width="1124" height="624" rx="12" fill="url(#paperGrid)"/>

  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <text x="72" y="86" fill="#182126" font-size="24" font-weight="700">FICHE 022 / JOURNAL &amp; RISQUE</text>
    <text x="1128" y="86" text-anchor="end" fill="#526166" font-size="14">Décision documentée · résultat mesurable</text>
    <line x1="72" y1="108" x2="1128" y2="108" stroke="#182126" stroke-width="2"/>

    <g transform="translate(72 138)">
      <text x="0" y="0" fill="#182126" font-size="14" font-weight="700">01 / AVANT LE TRADE</text>
      <g transform="translate(0 26)" font-size="13">
        <rect width="470" height="196" rx="4" fill="#f8faf8" stroke="#aab4b7"/>
        <text x="20" y="35" fill="#526166">Actif</text><text x="160" y="35" fill="#182126" font-weight="700">EURUSD</text>
        <line x1="18" y1="48" x2="452" y2="48" stroke="#c7ced0"/>
        <text x="20" y="78" fill="#526166">Contexte</text><text x="160" y="78" fill="#182126" font-weight="700">Daily haussier · H1 en POI</text>
        <line x1="18" y1="92" x2="452" y2="92" stroke="#c7ced0"/>
        <text x="20" y="122" fill="#526166">Déclencheur</text><text x="160" y="122" fill="#182126" font-weight="700">Sweep + CHoCH M5</text>
        <line x1="18" y1="136" x2="452" y2="136" stroke="#c7ced0"/>
        <text x="20" y="166" fill="#526166">Invalidation</text><text x="160" y="166" fill="#a8373e" font-weight="700">Sous le sweep · 25 pips</text>
      </g>
    </g>

    <g transform="translate(574 138)">
      <text x="0" y="0" fill="#182126" font-size="14" font-weight="700">02 / CALCULER</text>
      <rect y="26" width="554" height="196" rx="4" fill="#182126"/>
      <text x="24" y="68" fill="#aab4b7" font-size="13">Capital</text><text x="300" y="68" text-anchor="end" fill="#eef1ee" font-size="18" font-weight="700">5 000 $</text>
      <text x="24" y="102" fill="#aab4b7" font-size="13">Risque prévu</text><text x="300" y="102" text-anchor="end" fill="#eef1ee" font-size="18" font-weight="700">1 % = 50 $</text>
      <text x="24" y="136" fill="#aab4b7" font-size="13">SL × valeur du pip</text><text x="300" y="136" text-anchor="end" fill="#eef1ee" font-size="18" font-weight="700">25 × 10 $</text>
      <line x1="24" y1="154" x2="530" y2="154" stroke="#526166"/>
      <text x="24" y="190" fill="#6be0b5" font-size="14" font-weight="700">TAILLE THÉORIQUE</text>
      <text x="530" y="190" text-anchor="end" fill="#6be0b5" font-size="30" font-weight="700">0,20 lot</text>
    </g>

    <g transform="translate(72 390)">
      <text x="0" y="0" fill="#182126" font-size="14" font-weight="700">03 / CONTRÔLER</text>
      <rect y="24" width="470" height="174" rx="4" fill="#f8faf8" stroke="#aab4b7"/>
      <g font-size="14" fill="#182126">
        <rect x="20" y="47" width="18" height="18" rx="2" fill="#0b6b50"/><path d="M24 56l4 4 7-9" fill="none" stroke="#eef1ee" stroke-width="2"/><text x="52" y="61">Setup conforme au plan</text>
        <rect x="20" y="83" width="18" height="18" rx="2" fill="#0b6b50"/><path d="M24 92l4 4 7-9" fill="none" stroke="#eef1ee" stroke-width="2"/><text x="52" y="97">Risque et taille vérifiés</text>
        <rect x="20" y="119" width="18" height="18" rx="2" fill="#0b6b50"/><path d="M24 128l4 4 7-9" fill="none" stroke="#eef1ee" stroke-width="2"/><text x="52" y="133">SL et TP présents</text>
        <rect x="20" y="155" width="18" height="18" rx="2" fill="#765610"/><text x="29" y="169" text-anchor="middle" fill="#eef1ee" font-size="12" font-weight="700">!</text><text x="52" y="169">Capture avant l’entrée</text>
      </g>
    </g>

    <g transform="translate(574 390)">
      <text x="0" y="0" fill="#182126" font-size="14" font-weight="700">04 / REVOIR</text>
      <rect y="24" width="554" height="174" rx="4" fill="#f8faf8" stroke="#aab4b7"/>
      <text x="22" y="57" fill="#526166" font-size="13">Résultat</text><text x="132" y="57" fill="#0b6b50" font-size="20" font-weight="700">+1,6R</text>
      <text x="248" y="57" fill="#526166" font-size="13">Plan respecté</text><text x="420" y="57" fill="#0b6b50" font-size="15" font-weight="700">OUI</text>
      <line x1="22" y1="76" x2="532" y2="76" stroke="#c7ced0"/>
      <text x="22" y="106" fill="#526166" font-size="13">Courbe de capital (R)</text>
      <path d="M24 158L92 146L158 154L224 126L290 136L356 106L422 114L492 88" fill="none" stroke="#0b6b50" stroke-width="3"/>
      <path d="M24 158L92 146L158 154L224 126L290 136L356 106L422 114L492 88L492 164L24 164Z" fill="#0b6b50" fill-opacity=".1"/>
    </g>

    <line x1="72" y1="620" x2="1128" y2="620" stroke="#aab4b7"/>
    <text x="72" y="644" fill="#526166" font-size="12">Valeurs d’exemple uniquement — vérifier le contrat, la valeur du pip et le pas de volume du broker.</text>
    <text x="1128" y="644" text-anchor="end" fill="#a8373e" font-size="12" font-weight="700">UN BON PROCESSUS PEUT PRODUIRE UNE PERTE</text>
  </g>
</svg>
