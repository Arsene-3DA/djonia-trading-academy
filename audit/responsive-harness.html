<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit responsive — Djonia Trading Academy</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0d1418; color: #eef1ee; font: 14px/1.45 system-ui, sans-serif; }
    header { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px; border-bottom: 1px solid #34434a; background: #182126; }
    header strong { font-size: 16px; }
    header span { color: #aab4b7; }
    main { padding: 16px; }
    #viewport-shell { margin: 0 auto; overflow: hidden; border: 1px solid #526166; background: #11191d; box-shadow: 0 18px 54px rgba(0,0,0,.38); }
    iframe { display: block; border: 0; transform-origin: top left; background: #11191d; }
    #audit-result { width: min(1100px, calc(100% - 32px)); max-height: 160px; overflow: auto; margin: 16px auto; padding: 12px; border: 1px solid #34434a; background: #182126; color: #b9c3c4; white-space: pre-wrap; font: 11px/1.45 ui-monospace, monospace; }
  </style>
</head>
<body>
  <header><strong>Preuve responsive Djonia</strong><span id="audit-label">Préparation…</span></header>
  <main><div id="viewport-shell"><iframe id="site-frame" title="Site Djonia à la largeur auditée"></iframe></div></main>
  <pre id="audit-result" data-testid="audit-result">Audit en cours…</pre>
  <script>
    const params = new URLSearchParams(location.search);
    const width = Math.max(320, Math.min(2560, Number(params.get("w")) || 375));
    const height = 800;
    const view = params.get("view") || "home";
    const inspectMenu = params.get("menu") !== "0";
    const availableWidth = Math.max(280, innerWidth - 48);
    const availableHeight = Math.max(420, innerHeight - 150);
    const scale = Math.min(1, availableWidth / width, availableHeight / height);
    const frame = document.getElementById("site-frame");
    const shell = document.getElementById("viewport-shell");
    const resultNode = document.getElementById("audit-result");
    document.getElementById("audit-label").textContent = `${view} · ${width} × ${height}px · aperçu ${Math.round(scale * 100)}%`;
    frame.style.width = `${width}px`;
    frame.style.height = `${height}px`;
    frame.style.transform = `scale(${scale})`;
    shell.style.width = `${Math.round(width * scale)}px`;
    shell.style.height = `${Math.round(height * scale)}px`;
    frame.src = "../index.html";

    const nextPaint = child => new Promise(resolve => child.requestAnimationFrame(() => child.requestAnimationFrame(resolve)));
    const isDisplayed = (child, element) => {
      const style = child.getComputedStyle(element);
      const rect = element.getBoundingClientRect();
      return style.display !== "none" && style.visibility !== "hidden" && rect.width > 0 && rect.height > 0 && rect.right > 0 && rect.left < child.innerWidth;
    };

    frame.addEventListener("load", async () => {
      try {
        const child = frame.contentWindow;
        const doc = frame.contentDocument;
        const click = selector => doc.querySelector(selector)?.click();
        if (view === "catalog") click("#allModulesButton");
        if (view === "lesson") click('[data-module="3"]');
        if (view === "journal") click('[data-module="22"]');
        if (view === "exam") click('[data-exam="1"]');
        await nextPaint(child);
        await Promise.race([
          Promise.all([...doc.images].map(image => image.complete ? Promise.resolve() : new Promise(resolve => image.addEventListener("load", resolve, { once: true })))),
          new Promise(resolve => child.setTimeout(resolve, 1200))
        ]);
        if (doc.fonts?.ready) await Promise.race([doc.fonts.ready, new Promise(resolve => child.setTimeout(resolve, 800))]);
        const scrollToTarget = (selector, offset = 74) => {
          const target = doc.querySelector(selector);
          if (!target) return;
          child.scrollTo({ top: Math.max(0, target.getBoundingClientRect().top + child.scrollY - offset), behavior: "instant" });
        };
        if (view === "calculator") scrollToTarget("#toolsSection");
        if (view === "hero") scrollToTarget(".hero-image", 74);
        if (view === "journal") scrollToTarget("#journalForm");
        if (view === "lesson") scrollToTarget(".visual-learning");
        if (view === "risk") scrollToTarget('.visual-preview-link[data-modal-src="assets/risk-journal-sheet.svg"]', 170);
        if (view === "exam-overview") scrollToTarget(".exam-overview");
        await nextPaint(child);
        await new Promise(resolve => child.setTimeout(resolve, 120));

        const root = doc.documentElement;
        const body = doc.body;
        const targetSelector = 'button:not([hidden]), a[href], summary, input:not([type="radio"]):not([type="hidden"]), select, textarea, label.quiz-option';
        const targets = [...doc.querySelectorAll(targetSelector)].filter(element => isDisplayed(child, element));
        const targetMetrics = targets.map(element => {
          const rect = element.getBoundingClientRect();
          return {
            label: (element.getAttribute("aria-label") || element.textContent || element.getAttribute("placeholder") || element.tagName).replace(/\s+/g, " ").trim().slice(0, 72),
            tag: element.tagName.toLowerCase(),
            width: Math.round(rect.width * 10) / 10,
            height: Math.round(rect.height * 10) / 10
          };
        });
        const undersizedTargets = targetMetrics.filter(item => item.width < 44 || item.height < 44);

        let menu = { applicable: width <= 900, inspected: inspectMenu };
        if (width <= 900 && inspectMenu) {
          click("#menuButton");
          void doc.querySelector("#sidebar").offsetWidth;
          await new Promise(resolve => child.setTimeout(resolve, 40));
          const sidebar = doc.querySelector("#sidebar").getBoundingClientRect();
          const close = doc.querySelector("#sidebarCloseButton").getBoundingClientRect();
          menu = {
            applicable: true,
            opens: doc.querySelector("#sidebar").classList.contains("open") && sidebar.left >= -1,
            className: doc.querySelector("#sidebar").className,
            sidebarRect: { left: Math.round(sidebar.left * 10) / 10, right: Math.round(sidebar.right * 10) / 10, width: Math.round(sidebar.width * 10) / 10 },
            transform: child.getComputedStyle(doc.querySelector("#sidebar")).transform,
            closeTarget: { width: Math.round(close.width), height: Math.round(close.height) },
            closeFocused: doc.activeElement?.id === "sidebarCloseButton",
            backdropVisible: !doc.querySelector("#sidebarBackdrop").hidden
          };
          click("#sidebarCloseButton");
          void doc.querySelector("#sidebar").offsetWidth;
          await new Promise(resolve => child.setTimeout(resolve, 40));
          menu.closes = !doc.querySelector("#sidebar").classList.contains("open") && doc.querySelector("#sidebarBackdrop").hidden;
        }

        const images = [...doc.images].filter(image => isDisplayed(child, image)).map(image => {
          const rect = image.getBoundingClientRect();
          return {
            src: image.getAttribute("src"),
            rendered: `${Math.round(rect.width)}×${Math.round(rect.height)}`,
            intrinsicAttributes: `${image.getAttribute("width") || "—"}×${image.getAttribute("height") || "—"}`,
            zoomAvailable: Boolean(image.closest(".visual-preview-link, .figure-zoom-link, .lesson-visual-link") || doc.querySelector(`a[href="${image.getAttribute("src")}"]`))
          };
        });
        const gridColumns = selector => {
          const node = doc.querySelector(selector);
          return node ? child.getComputedStyle(node).gridTemplateColumns : null;
        };
        const background = selector => {
          const node = doc.querySelector(selector);
          return node ? child.getComputedStyle(node).backgroundColor : null;
        };
        const scrollWidth = Math.max(root.scrollWidth, body.scrollWidth);
        const heroImage = doc.querySelector(".hero-image");
        const heroRect = heroImage?.getBoundingClientRect();
        const heroStyle = heroImage ? child.getComputedStyle(heroImage) : null;
        const report = {
          width,
          height,
          view,
          viewport: { width: child.innerWidth, height: child.innerHeight },
          geometry: {
            clientWidth: root.clientWidth,
            scrollWidth,
            overflowPixels: Math.max(0, scrollWidth - root.clientWidth),
            horizontalOverflow: scrollWidth > root.clientWidth + 1
          },
          touchTargets: {
            checked: targetMetrics.length,
            minimumRequired: width <= 414 ? "44×44" : "non bloquant hors mobile",
            undersized: width <= 414 ? undersizedTargets : []
          },
          images,
          hero: heroImage ? {
            rendered: `${Math.round(heroRect.width)}×${Math.round(heroRect.height)}`,
            intrinsicAttributes: `${heroImage.getAttribute("width")}×${heroImage.getAttribute("height")}`,
            objectFit: heroStyle.objectFit,
            objectPosition: heroStyle.objectPosition,
            aspectRatio: heroStyle.aspectRatio,
            fullyInsideViewport: heroRect.left >= -1 && heroRect.right <= child.innerWidth + 1,
            croppingGuardPassed: heroStyle.objectFit === "contain" && heroStyle.aspectRatio === "1200 / 700"
          } : null,
          catalogue: {
            moduleButtons: doc.querySelectorAll("#moduleList [data-module]").length,
            masterclassBadges: [...doc.querySelectorAll(".module-track")].map(node => node.textContent.trim())
          },
          menu,
          lessonIndex: doc.querySelector(".lesson-index") ? {
            position: child.getComputedStyle(doc.querySelector(".lesson-index")).position,
            width: Math.round(doc.querySelector(".lesson-index").getBoundingClientRect().width)
          } : null,
          grids: {
            exams: gridColumns(".exam-grid"),
            examModes: gridColumns(".exam-mode-grid"),
            calculator: gridColumns(".tools-panel .field-grid"),
            journal: gridColumns(".journal-grid")
          },
          surfaces: {
            body: background("body"),
            exams: background(".exam-overview"),
            lesson: background(".lesson-card"),
            catalogueOrExam: background(".search-results"),
            tools: background(".tools-panel")
          }
        };
        resultNode.textContent = JSON.stringify(report, null, 2);
        document.body.dataset.ready = "true";
      } catch (error) {
        resultNode.textContent = JSON.stringify({ width, view, error: String(error?.stack || error) }, null, 2);
        document.body.dataset.ready = "error";
      }
    });
  </script>
</body>
</html>
